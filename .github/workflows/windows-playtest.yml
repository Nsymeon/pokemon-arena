name: Windows playtest

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-playtest
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.3 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip' -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
      - name: Validate data and combat
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/audit-adventure.py
          if ($LASTEXITCODE -ne 0) { throw 'Adventure map/audio audit failed' }
          python tools/audit-kanto-3d.py
          if ($LASTEXITCODE -ne 0) { throw 'Modern Kanto geometry audit failed' }
          node tools/validate-data.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Roster validation failed' }
          node tools/validate-trainers.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Trainer validation failed' }
          $art = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-art-mesh.gd 2>&1
          $artCode = $LASTEXITCODE
          $art | Write-Output
          if ($artCode -ne 0 -or ($art -match 'SCRIPT ERROR|ERROR:') -or -not ($art -match 'ART GEOMETRY CHECK: 0 failures')) { throw 'Art geometry checks failed' }
          $log = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . -- --smoke-test 2>&1
          $code = $LASTEXITCODE
          $log | Write-Output
          if ($code -ne 0 -or ($log -match 'SCRIPT ERROR|ERROR:|FAIL:') -or -not ($log -match 'PASS: major statuses')) { throw 'Combat checks failed' }
          $story = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-story-progression.gd -- --qa-story 2>&1
          $storyCode = $LASTEXITCODE
          $story | Write-Output
          if ($storyCode -ne 0 -or ($story -match 'SCRIPT ERROR|ERROR:') -or -not ($story -match 'STORY / DAILY CHECK: \[\]')) { throw 'Story and daily League checks failed' }
      - name: National and challenge regression
        shell: pwsh
        run: |
          $national = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-national-update.gd -- --qa-national 2>&1
          $code = $LASTEXITCODE
          $national | Write-Output
          if ($code -ne 0 -or ($national -match 'SCRIPT ERROR|ERROR:') -or -not ($national -match 'NATIONAL UPDATE: PASS')) { throw 'National update checks failed' }
          $daily = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-daily-coverage.gd -- --qa-daily 2>&1
          $dailyCode = $LASTEXITCODE
          $daily | Write-Output
          if ($dailyCode -ne 0 -or ($daily -match 'SCRIPT ERROR|ERROR:') -or -not ($daily -match 'DAILY COVERAGE CHECK: \[\]')) { throw 'Daily coverage or Surf checks failed' }
      - name: Opening story and breeding regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force captures | Out-Null
          $rooms = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-rooms-story-breeding.gd -- --qa-rooms 2>&1
          $code = $LASTEXITCODE
          $rooms | Write-Output
          if ($code -ne 0 -or ($rooms -match 'SCRIPT ERROR|ERROR:') -or -not ($rooms -match 'ROOMS / STORY / BREEDING CHECK: \[\]')) { throw 'Opening and breeding checks failed' }
      - name: Adventure Gym fidelity regression
        shell: pwsh
        run: |
          $gyms = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-adventure-gyms.gd -- --qa-gyms 2>&1
          $code = $LASTEXITCODE
          $gyms | Write-Output
          if ($code -ne 0 -or ($gyms -match 'SCRIPT ERROR|ERROR:') -or -not ($gyms -match 'ADVENTURE GYM CHECK: \[\]')) { throw 'Adventure Gym fidelity checks failed' }
      - name: Adventure trainer fidelity regression
        shell: pwsh
        run: |
          $trainers = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-adventure-trainers.gd -- --qa-trainers 2>&1
          $code = $LASTEXITCODE
          $trainers | Write-Output
          if ($code -ne 0 -or ($trainers -match 'SCRIPT ERROR|ERROR:') -or -not ($trainers -match 'ADVENTURE TRAINER CHECK: \[\]')) { throw 'Adventure trainer fidelity checks failed' }
      - name: Ordered NPC dialogue regression
        shell: pwsh
        run: |
          $npcs = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-npc-programs.gd -- --qa-npcs 2>&1
          $code = $LASTEXITCODE
          $npcs | Write-Output
          if ($code -ne 0 -or ($npcs -match 'SCRIPT ERROR|ERROR:') -or -not ($npcs -match 'NPC PROGRAM CHECK: \[\]')) { throw 'NPC program checks failed' }
      - name: Economy and storage regression
        shell: pwsh
        run: |
          $economy = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-economy-storage.gd -- --qa-economy 2>&1
          $code = $LASTEXITCODE
          $economy | Write-Output
          if ($code -ne 0 -or ($economy -match 'SCRIPT ERROR|ERROR:') -or -not ($economy -match 'ECONOMY / STORAGE CHECK: \[\]')) { throw 'Economy/storage checks failed' }
      - name: Map pickups and Day Care regression
        shell: pwsh
        run: |
          $pickups = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-map-pickups.gd -- --qa-pickups 2>&1
          $code = $LASTEXITCODE
          $pickups | Write-Output
          if ($code -ne 0 -or ($pickups -match 'SCRIPT ERROR|ERROR:') -or -not ($pickups -match 'MAP PICKUP CHECK: \[\]')) { throw 'Map pickup checks failed' }
          $daycare = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-daycare-fidelity.gd -- --qa-daycare 2>&1
          $code = $LASTEXITCODE
          $daycare | Write-Output
          if ($code -ne 0 -or ($daycare -match 'SCRIPT ERROR|ERROR:') -or -not ($daycare -match 'DAY CARE FIDELITY CHECK: \[\]')) { throw 'Day Care checks failed' }
      - name: Vs Seeker regression
        shell: pwsh
        run: |
          $seeker = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-vs-seeker.gd -- --qa-seeker 2>&1
          $code = $LASTEXITCODE
          $seeker | Write-Output
          if ($code -ne 0 -or ($seeker -match 'SCRIPT ERROR|ERROR:') -or -not ($seeker -match 'VS SEEKER CHECK: \[\]')) { throw 'Vs Seeker checks failed' }
      - name: Double battles and remaining services
        shell: pwsh
        run: |
          $checks = @(
            @('check-art-cache.gd', 'ART CACHE CHECK: \[\]'),
            @('check-double-battles.gd', 'DOUBLE BATTLE CHECK: \[\]'),
            @('check-service-fidelity.gd', 'SERVICE FIDELITY CHECK: \[\]'),
            @('check-trainer-tower.gd', 'TRAINER TOWER CHECK: \[\]')
          )
          foreach ($check in $checks) {
            $result = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script "tools/$($check[0])" -- --qa-fidelity 2>&1
            $code = $LASTEXITCODE
            $result | Write-Output
            if ($code -ne 0 -or ($result -match 'SCRIPT ERROR|ERROR:') -or -not ($result -match $check[1])) { throw "Fidelity check failed: $($check[0])" }
          }
      - name: Continuous campaign and puzzle paths
        timeout-minutes: 5
        shell: pwsh
        run: |
          $checks = @(
            @('check-campaign-journey.gd', 'CAMPAIGN JOURNEY CHECK: \[\]'),
            @('check-puzzle-paths.gd', 'PUZZLE PATH CHECK: \[\]'),
            @('check-puzzle-transitions.gd', 'PUZZLE TRANSITION CHECK: \[\]')
          )
          foreach ($check in $checks) {
            $result = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script "tools/$($check[0])" -- --qa-fidelity --qa-snapshots 2>&1
            $code = $LASTEXITCODE
            $result | Write-Output
            if ($code -ne 0 -or ($result -match 'SCRIPT ERROR|ERROR:') -or -not ($result -match $check[1])) { throw "Campaign/puzzle check failed: $($check[0])" }
          }
      - name: Save deletion regression
        shell: pwsh
        run: |
          $deletion = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-save-deletion.gd -- --qa-delete 2>&1
          $code = $LASTEXITCODE
          $deletion | Write-Output
          if ($code -ne 0 -or ($deletion -match 'SCRIPT ERROR|ERROR:') -or -not ($deletion -match 'SAVE DELETION CHECK: \[\]')) { throw 'Save deletion checks failed' }
      - name: Package Windows build
        shell: pwsh
        run: |
          python tools/package-windows.py --runtime "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64.exe" --version "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Publish tested release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "playtest-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          $body = "Windows playtest from commit $env:GITHUB_SHA. Extract the entire ZIP and run PLAY.bat. Single-player against AI."
          $body | Set-Content "$env:RUNNER_TEMP/release-notes.txt" -Encoding utf8
          gh release create $tag dist/PokemonArena-Windows.zip dist/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "Windows playtest $env:GITHUB_RUN_NUMBER" --notes-file "$env:RUNNER_TEMP/release-notes.txt" --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
