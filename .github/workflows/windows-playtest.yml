name: Windows playtest

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-playtest
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.3 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip' -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
      - name: Validate data and combat
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/audit-adventure.py
          if ($LASTEXITCODE -ne 0) { throw 'Adventure map/audio audit failed' }
          python tools/audit-kanto-3d.py
          if ($LASTEXITCODE -ne 0) { throw 'Modern Kanto geometry audit failed' }
          node tools/validate-data.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Roster validation failed' }
          node tools/validate-trainers.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Trainer validation failed' }
          $art = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-art-mesh.gd 2>&1
          $artCode = $LASTEXITCODE
          $art | Write-Output
          if ($artCode -ne 0 -or ($art -match 'SCRIPT ERROR|ERROR:') -or -not ($art -match 'ART GEOMETRY CHECK: 0 failures')) { throw 'Art geometry checks failed' }
          $log = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . -- --smoke-test 2>&1
          $code = $LASTEXITCODE
          $log | Write-Output
          if ($code -ne 0 -or ($log -match 'SCRIPT ERROR|ERROR:|FAIL:') -or -not ($log -match 'PASS: major statuses')) { throw 'Combat checks failed' }
          $story = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-story-progression.gd -- --qa-story 2>&1
          $storyCode = $LASTEXITCODE
          $story | Write-Output
          if ($storyCode -ne 0 -or ($story -match 'SCRIPT ERROR|ERROR:') -or -not ($story -match 'STORY / DAILY CHECK: \[\]')) { throw 'Story and daily League checks failed' }
      - name: National and challenge regression
        shell: pwsh
        run: |
          $national = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-national-update.gd -- --qa-national 2>&1
          $code = $LASTEXITCODE
          $national | Write-Output
          if ($code -ne 0 -or ($national -match 'SCRIPT ERROR|ERROR:') -or -not ($national -match 'NATIONAL UPDATE: PASS')) { throw 'National update checks failed' }
          $daily = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-daily-coverage.gd -- --qa-daily 2>&1
          $dailyCode = $LASTEXITCODE
          $daily | Write-Output
          if ($dailyCode -ne 0 -or ($daily -match 'SCRIPT ERROR|ERROR:') -or -not ($daily -match 'DAILY COVERAGE CHECK: \[\]')) { throw 'Daily coverage or Surf checks failed' }
      - name: Opening story and breeding regression
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force captures | Out-Null
          $rooms = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . --script tools/check-rooms-story-breeding.gd -- --qa-rooms 2>&1
          $code = $LASTEXITCODE
          $rooms | Write-Output
          if ($code -ne 0 -or ($rooms -match 'SCRIPT ERROR|ERROR:') -or -not ($rooms -match 'ROOMS / STORY / BREEDING CHECK: \[\]')) { throw 'Opening and breeding checks failed' }
      - name: Package Windows build
        shell: pwsh
        run: |
          python tools/package-windows.py --runtime "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64.exe" --version "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Publish tested release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "playtest-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          $body = "Windows playtest from commit $env:GITHUB_SHA. Extract the entire ZIP and run PLAY.bat. Single-player against AI."
          $body | Set-Content "$env:RUNNER_TEMP/release-notes.txt" -Encoding utf8
          gh release create $tag dist/PokemonArena-Windows.zip dist/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "Windows playtest $env:GITHUB_RUN_NUMBER" --notes-file "$env:RUNNER_TEMP/release-notes.txt" --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
