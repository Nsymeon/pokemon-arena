name: Windows playtest

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-playtest
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.3 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip' -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
      - name: Validate data and combat
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node tools/validate-data.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Roster validation failed' }
          node tools/validate-trainers.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Trainer validation failed' }
          $log = & "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64_console.exe" --headless --path . -- --smoke-test 2>&1
          $code = $LASTEXITCODE
          $log | Write-Output
          if ($code -ne 0 -or ($log -match 'SCRIPT ERROR|ERROR:|FAIL:') -or -not ($log -match 'PASS: major statuses')) { throw 'Combat checks failed' }
      - name: Package Windows build
        shell: pwsh
        run: |
          python tools/package-windows.py --runtime "$env:RUNNER_TEMP/godot/Godot_v4.3-stable_win64.exe" --version "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Publish tested release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "playtest-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          $body = "Windows playtest from commit $env:GITHUB_SHA. Extract the entire ZIP and run PLAY.bat. Single-player against AI."
          $body | Set-Content "$env:RUNNER_TEMP/release-notes.txt" -Encoding utf8
          gh release create $tag dist/PokemonArena-Windows.zip dist/SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "Windows playtest $env:GITHUB_RUN_NUMBER" --notes-file "$env:RUNNER_TEMP/release-notes.txt" --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
